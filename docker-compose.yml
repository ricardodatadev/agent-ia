name: agent-ia

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # A imagem não traz curl: testa a porta pelo /dev/tcp do bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # mantém os modelos em memória (ADR-10)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Baixa os modelos uma única vez: se já existem no volume, não baixa de novo (AC-RF05-2).
  ollama-pull:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        models="$$EMBED_MODEL"
        [ "$$LLM_PROVIDER" = "ollama" ] && models="$$LLM_MODEL $$models"
        for m in $$models; do
          if ollama show "$$m" > /dev/null 2>&1; then
            echo "Modelo $$m já disponível."
          else
            echo "Baixando $$m..."
            ollama pull "$$m"
          fi
        done
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false # sem .env, valem os padrões do config.py
    environment:
      # Endereços internos da rede do compose (sobrescrevem os do .env, pensados para execução local)
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s # 1ª subida em CPU: ingestão (~1 min) + aquecimento dos modelos e prompts (~2-3 min)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000 # URL vista pelo navegador
        VITE_SHOW_DEBUG: ${SHOW_DEBUG:-true} # demo de portfólio ligada por padrão; mudar exige rebuild
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_models:
