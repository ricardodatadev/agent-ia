name: agent-ia

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # A imagem não traz curl: testa a porta pelo /dev/tcp do bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # mantém os modelos em memória (ADR-10)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Baixa os modelos uma única vez: se já existem no volume, não baixa de novo (AC-RF05-2).
  ollama-pull:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        models="$$EMBED_MODEL"
        [ "$$LLM_PROVIDER" = "ollama" ] && models="$$LLM_MODEL $$models"
        for m in $$models; do
          if ollama show "$$m" > /dev/null 2>&1; then
            echo "Modelo $$m já disponível."
          else
            echo "Baixando $$m..."
            ollama pull "$$m"
          fi
        done
    restart: "no"

volumes:
  qdrant_data:
  ollama_models:
